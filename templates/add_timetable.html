<!DOCTYPE html>
<html>

<head>

    <title>Add Timetable</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center">
        Create Timetable
    </h2>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-info">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="card p-4 shadow">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        class="form-control"
                        value="BSc IT"
                        required
                    >

                </div>


                <div class="mb-3">
    <label class="form-label">Semester</label>

    <select name="semester" id="semester" class="form-select" required>
        <option value="">Select Semester</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
    </select>
</div>
<div class="mb-3">
    <label class="form-label">Subject</label>

    <select name="subject_id" id="subject_id" class="form-select" required>
        <option value="">Select Subject</option>

        {% for subject in subjects %}
            <option
                value="{{ subject.subject_id }}"
                data-semester="{{ subject.semester }}">
                {{ subject.subject_name }}
            </option>
        {% endfor %}

    </select>
</div>

                


                <div class="col-md-6 mb-3">

                    <label>Faculty</label>

                    <select
                        name="faculty_id"
                        class="form-control"
                        required
                        disabled
                    >
                        {% for faculty in faculties %}
                            <option value="{{ faculty.faculty_id }}" selected>
                                {{ faculty.faculty_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>


                <div class="col-md-6 mb-3">

                    <label>Classroom</label>

                    <select
                        name="room_id"
                        class="form-control"
                        required
                    >

                        {% for room in classrooms %}

                            <option value="{{ room.room_id }}">

                                {{ room.room_no }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label>Day</label>

                    <select
                        name="day_name"
                        class="form-control"
                        required
                    >

                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>

                    </select>

                </div>


                <div class="col-md-12 mb-3">

                    <label>Time Slot</label>

                    <select
                        name="time_slot"
                        class="form-control"
                        required
                    >

                        <option>09:00 AM - 10:00 AM</option>

                        <option>10:00 AM - 11:00 AM</option>

                        <option>11:00 AM - 12:00 PM</option>

                        <option>12:00 PM - 01:00 PM</option>

                        <option>02:00 PM - 03:00 PM</option>

                        <option>03:00 PM - 04:00 PM</option>

                    </select>

                </div>

            </div>


            <button
                class="btn btn-primary">

                Save Timetable

            </button>


            <a
                href="{{ url_for('faculty_dashboard') }}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>
<script>
document.getElementById("semester").addEventListener("change", function () {

    const selectedSemester = this.value;
    const subjectDropdown = document.getElementById("subject_id");

    const options = subjectDropdown.querySelectorAll("option");

    subjectDropdown.value = "";

    options.forEach(function(option) {

        if (option.value === "") {
            option.style.display = "block";
        }
        else if (option.getAttribute("data-semester") === selectedSemester) {
            option.style.display = "block";
        }
        else {
            option.style.display = "none";
        }

    });
});
</script>

</body>

</html>
