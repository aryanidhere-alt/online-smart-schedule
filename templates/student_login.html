<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - Online Smart Schedule</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4 shadow">

                <h2 class="text-center mb-4">
                    🎓 Student Login
                </h2>


                <!-- Flash Messages -->

                {% with messages = get_flashed_messages() %}

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-warning">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <!-- Login Form -->

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>


                <div class="text-center mt-4">

                    <p>
                        New Student?
                        <a href="{{ url_for('student_register') }}">
                            Register here
                        </a>
                    </p>

                    <p>
                        <a href="{{ url_for('home') }}">
                            ← Back to Home
                        </a>
                    </p>

                </div>


            </div>

        </div>

    </div>

</div>

</body>

</html>
