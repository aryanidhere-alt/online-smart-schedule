<!DOCTYPE html>
<html>

<head>

    <title>Faculty Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4 shadow">

                <h2 class="text-center">
                    👨‍🏫 Faculty Login
                </h2>


                {% with messages = get_flashed_messages() %}

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-warning">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <form method="POST">

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        class="btn btn-warning w-100">

                        Faculty Login

                    </button>

                </form>


                <br>

                <p class="text-center">

                    <a href="{{ url_for('home') }}">
                        ← Back to Home
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
